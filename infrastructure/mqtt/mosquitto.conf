# Eclipse Mosquitto broker for OILINTELLIGENCE
# Authenticated clients only, topic-level ACLs, persistence for QoS1 sessions.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain listener on the internal Docker network only (not published to the host by default)
listener 1883 0.0.0.0

# TLS listener: mount certificates into /mosquitto/certs and uncomment for any
# connection that leaves the Docker network (plant gateways, remote simulators).
# listener 8883 0.0.0.0
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false

max_queued_messages 200000
message_size_limit 262144
