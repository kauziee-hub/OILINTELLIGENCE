# Alembic configuration for the main application database (oilintel).
# The backend applies migrations automatically at startup (app.core.db.init_db);
# the CLI is for authoring new revisions:
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
# DATABASE_URL (or .env) selects the database, exactly as for the backend.
[alembic]
script_location = %(here)s/database/migrations
prepend_sys_path = . apps/backend
path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
