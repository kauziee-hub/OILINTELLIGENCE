[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oilintelligence"
version = "1.0.0"
description = "Agentic AI-assisted hydrocarbon loss attribution and root cause investigation using physics-guided machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - research use" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "pyyaml>=6",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "paho-mqtt>=2.1",
    "asyncua>=1.1",
    "langgraph>=0.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
broker = ["amqtt>=0.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
oil-sim = "simulation.engine.runner:main"
oil-dataset = "intelligence.training.dataset:main"
oil-train = "intelligence.training.train:main"
oil-experiments = "experiments.run_experiments:main"

[tool.setuptools.packages.find]
include = ["simulation*", "industrial*", "intelligence*", "agents*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/backend/tests"]
pythonpath = [".", "apps/backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running simulation tests"]
